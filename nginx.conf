server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  port_in_redirect off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  # Halaman utama dan /kontak (tanpa harus mengetik /kontak/).
  location = /kontak { try_files /kontak/index.html =404; }
  location = /bisnis { try_files /bisnis/index.html =404; }
  location = /sertifikat { try_files /sertifikat/index.html =404; }

  location ~* \.(?:css|js)$ {
    expires 1h;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  location ~* \.(?:svg|png|webp|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  # Alamat lama atau salah ketik: arahkan ke beranda supaya tidak ada halaman error.
  error_page 404 = @beranda;
  location @beranda { return 301 /; }
}
